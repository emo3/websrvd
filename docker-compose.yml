services:
  nginx:
    container_name: websrv
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEBSRV_HOST:-10.1.1.30}:${WEBSRV_PORT:-443}:443"
    volumes:
      - ${HOME}/repos:/usr/share/nginx/html
    healthcheck:
      # Chainguard nginx images are minimal and may not include curl or wget.
      # Use a lightweight nginx config sanity check (works without extra tools).
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
