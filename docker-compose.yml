services:
  nginx:
    container_name: websrv
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEBSRV_HOST:-10.1.1.30}:${WEBSRV_PORT:-443}:443"
    volumes:
      - "${REPOS_PATH:-/mnt/spare/repos}:/usr/share/nginx/html"
    healthcheck:
      # Use "CMD" instead of "CMD-SHELL" to execute the binary directly without a shell
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
